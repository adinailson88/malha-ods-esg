<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sombra digital da manutenção</title>
<meta name="description" content="Estado da carteira de chamados, prioridade de manutenção com incerteza, qualidade dos dados e cenários, por campus e sistema técnico. Protótipo metodológico.">
<style>
:root{
  --paper:#f2efe7; --ink:#16130f; --soft:#5d574c; --rule:#cfc8b8; --hair:#e2dccd; --mark:#d9d2c0;
  --a:#c5410c;
  --c0:#0b5e8e; --c1:#c5410c; --c2:#0a7a5c; --c3:#a3477f;
  --h0:#ebe5d6; --h1:#0b5e8e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --paper:#14120e; --ink:#ece6d8; --soft:#a79f8e; --rule:#3a352b; --hair:#27231c; --mark:#3a352b;
    --a:#ff8a4c; --c0:#6fb7e6; --c1:#ff8a4c; --c2:#48c9a0; --c3:#e08fc4; --h0:#1d1a14; --h1:#6fb7e6;
  }
}
:root[data-tema="escuro"]{
  --paper:#14120e; --ink:#ece6d8; --soft:#a79f8e; --rule:#3a352b; --hair:#27231c; --mark:#3a352b;
  --a:#ff8a4c; --c0:#6fb7e6; --c1:#ff8a4c; --c2:#48c9a0; --c3:#e08fc4; --h0:#1d1a14; --h1:#6fb7e6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--serif);font-feature-settings:"kern","liga"}
::selection{background:var(--a);color:var(--paper)}
a{color:inherit;text-decoration-color:var(--a);text-underline-offset:3px}
code,.m{font-family:var(--mono);font-size:.84em}
.k{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}

.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:28px 22px 24px 28px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:20px}
.rail h1{font:600 1.5rem/1.12 var(--serif);letter-spacing:-.015em;margin:6px 0 0}
.rail ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.rail ol a{display:grid;grid-template-columns:30px 1fr;padding:8px 0;border-bottom:1px solid var(--hair);text-decoration:none;color:var(--soft);font-size:.95rem}
.rail ol a b{font:400 .72rem var(--mono);color:var(--soft);padding-top:3px}
.rail ol a:hover,.rail ol a.on{color:var(--ink)}
.rail ol a.on b{color:var(--a)}
.rail ol a.on{box-shadow:inset 3px 0 0 var(--a);padding-left:10px;margin-left:-10px}
.ctl{display:grid;gap:10px}
.ctl label,.ctl .lb{display:grid;gap:4px}
select{appearance:none;background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;color:var(--ink);font:500 .95rem var(--mono);padding:4px 18px 4px 0;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.tg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink)}
.tg button{appearance:none;border:0;background:transparent;color:var(--ink);font:500 .74rem var(--mono);padding:7px 4px;cursor:pointer}
.tg button+button{border-left:1px solid var(--ink)}
.tg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
dl.meta{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font:400 .7rem/1.4 var(--mono);color:var(--soft)}
dl.meta dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.rail .tema{margin-top:auto}
.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 .72rem var(--mono);padding:6px 10px;cursor:pointer;letter-spacing:.04em}
.btn:hover{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}

main{padding:0 clamp(18px,4vw,56px) 80px;max-width:1040px}
.ribbon{margin:0 calc(-1 * clamp(18px,4vw,56px));padding:9px clamp(18px,4vw,56px);background:var(--ink);color:var(--paper);font:500 .72rem/1.4 var(--mono);letter-spacing:.06em;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
.ribbon span:last-child{opacity:.75}
section{padding-top:46px}
section>header{display:grid;grid-template-columns:54px 1fr;gap:0 4px;border-top:2px solid var(--ink);padding-top:10px;margin-bottom:18px}
section>header .num{font:400 .8rem var(--mono);color:var(--a);padding-top:7px}
section>header h2{font:600 1.75rem/1.15 var(--serif);letter-spacing:-.015em;margin:0}
section>header p{grid-column:2;margin:6px 0 0;color:var(--soft);max-width:62ch}
.fig{margin:22px 0 6px}
.fig>.k{display:block;margin-bottom:8px}
.cap{font-size:.86rem;color:var(--soft);max-width:70ch;margin:8px 0 0}
.cap b{color:var(--ink);font-weight:600}
svg{display:block;max-width:100%;height:auto;overflow:visible}
svg text{fill:var(--ink);font-family:var(--serif)}
svg .n{font-family:var(--mono)}
svg .s{fill:var(--soft)!important}
.scroll{overflow-x:auto;max-width:100%}
.scroll>svg{min-width:var(--mw,0)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
thead th{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--ink)}
tbody td{padding:7px 10px 7px 0;border-bottom:1px solid var(--hair);vertical-align:baseline}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:.84rem;font-variant-numeric:tabular-nums;padding-right:14px}
.sq{display:inline-block;width:8px;height:8px;margin-right:7px}
.in{color:var(--c2)} .out{color:var(--a);font-weight:600}
.sl{display:grid;grid-template-columns:170px 1fr 38px;gap:14px;align-items:center;margin:9px 0;font-size:.95rem}
.sl output{font:400 .85rem var(--mono);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;margin-top:-9px;background:var(--a);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:12px;height:18px;background:var(--a);border:0;border-radius:0}
ol.lim{margin:10px 0 0;padding:0;list-style:none;counter-reset:l;max-width:74ch}
ol.lim li{counter-increment:l;display:grid;grid-template-columns:34px 1fr;padding:8px 0;border-bottom:1px solid var(--hair)}
ol.lim li::before{content:counter(l,decimal-leading-zero);font:400 .75rem var(--mono);color:var(--a);padding-top:4px}
.crit{display:grid;grid-template-columns:150px 1fr;gap:6px 18px;margin:0;max-width:74ch}
.crit dt{font:500 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);padding-top:4px}
.crit dd{margin:0 0 10px}
p.lead{max-width:66ch}
footer{margin-top:60px;padding-top:12px;border-top:1px solid var(--rule);font:400 .7rem/1.5 var(--mono);color:var(--soft);overflow-wrap:anywhere}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:18px 18px 14px}
  .rail ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
  .ctl{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
  dl.meta{display:none}
  .rail .tema{margin-top:0}
  .sl{grid-template-columns:120px 1fr 34px}
  .crit{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
@media print{.rail .ctl,.rail .tema,nav{display:none}.layout{display:block}.rail{position:static;height:auto;border:0}.ribbon{background:none;color:#000;border-block:1px solid #000}section{break-inside:avoid-page}}
</style>
</head>
<body>
<div class="layout">
  <aside class="rail">
    <div>
      <div class="k">UFSB · eixo ODS/ESG</div>
      <h1>Sombra digital da manutenção predial</h1>
    </div>
    <nav aria-label="Seções" id="nav"></nav>
    <div class="ctl" id="ctl"></div>
    <dl class="meta" id="meta"></dl>
    <div class="tema"><button class="btn" id="tema" type="button" aria-label="Alternar entre tema claro e escuro">CLARO / ESCURO</button></div>
  </aside>
  <main id="app">
    <div class="ribbon" role="note"><span>PROTÓTIPO METODOLÓGICO · NÃO É RESULTADO DE ARTIGO</span><span>dados agregados reais · sem simulação</span></div>
    <section id="estado"></section>
    <section id="prioridade"></section>
    <section id="qualidade"></section>
    <section id="cenarios"></section>
    <section id="metodo"></section>
    <footer id="rodape"></footer>
  </main>
</div>
<script src="dados/dados.js"></script>
<script>
(function(){
"use strict";
var D = window.GEMEO;
var app = document.getElementById("app");
if(!D){ app.innerHTML = '<p style="padding:40px">Não foi possível carregar <code>dados/dados.js</code>. Gere os dados com <code>python scripts/replicacao/gerar_dados_gemeo.py &lt;caminho&gt;/chamados.json</code>.</p>'; return; }

var NS = "http://www.w3.org/2000/svg";
var CAMPOS = D.meta.campi, COR = {}, CURTO = {}, CV = ["var(--c0)","var(--c1)","var(--c2)","var(--c3)"];
CAMPOS.forEach(function(c,i){ COR[c.id] = CV[i]; CURTO[c.id] = c.curto; });
var FAM = {"Estrutura Predial":"Estrutura","Climatização":"Climatização","Elétrica":"Elétrica","Hidrossanitária":"Hidrossanitária","TI / Dados / Rede":"TI e rede","Instalação de Acessórios e Mobiliário":"Acessórios"};
var estado = { ano: 2025, variante: "exposicao", pesos: [25,25,25,25] };

function h(t,a,k){ var e=document.createElement(t); if(a){for(var x in a){ if(x==="html") e.innerHTML=a[x]; else if(x==="text") e.textContent=a[x]; else e.setAttribute(x,a[x]); }} (k||[]).forEach(function(c){ if(c) e.appendChild(c); }); return e; }
function s(t,a,k){ var e=document.createElementNS(NS,t); if(a){for(var x in a){ if(x==="text") e.textContent=a[x]; else e.setAttribute(x,a[x]); }} (k||[]).forEach(function(c){ if(c) e.appendChild(c); }); return e; }
function nf(v,d){ return v==null ? "n/d" : v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function f0(v){ return nf(v==null?null:Math.round(v),0); }
function pc(v){ return v==null ? "n/d" : Math.round(100*v)+"%"; }
function nome(a){ return CURTO[a.campus]+" · "+(FAM[a.familia]||a.familia); }
function rolavel(svg,mw){ var d=h("div",{class:"scroll",style:"--mw:"+mw+"px"}); d.appendChild(svg); return d; }
function cab(id,num,titulo,sub){
  var r=document.getElementById(id); r.innerHTML="";
  r.appendChild(h("header",{},[h("span",{class:"num",text:num}),h("h2",{text:titulo}),sub?h("p",{text:sub}):null]));
  return r;
}
function fig(r,rotulo){ var f=h("div",{class:"fig"}); f.appendChild(h("span",{class:"k",text:rotulo})); r.appendChild(f); return f; }
function painelDe(c,a){ return D.painel.filter(function(p){return p.campus===c && p.ano===a;})[0]; }

/* ---------- trilho: navegação, controles, metadados ---------- */
var SEC = [["estado","Estado da carteira"],["prioridade","Prioridade com incerteza"],["qualidade","Qualidade dos dados"],["cenarios","Cenários de pesos"],["metodo","Método e limites"]];
var nav = h("ol");
SEC.forEach(function(x,i){ nav.appendChild(h("li",{},[h("a",{href:"#"+x[0],"data-s":x[0]},[h("b",{text:"0"+(i+1)}),document.createTextNode(x[1])])])); });
document.getElementById("nav").appendChild(nav);
(function(){
  var ctl=document.getElementById("ctl");
  var sel=h("select",{id:"sel-ano","aria-label":"Ano do índice"});
  Object.keys(D.prioridade).forEach(function(a){ var o=h("option",{value:a,text:a}); if(+a===estado.ano) o.selected=true; sel.appendChild(o); });
  sel.addEventListener("change",function(){ estado.ano=+sel.value; redesenhar(); });
  ctl.appendChild(h("label",{},[h("span",{class:"k",text:"Ano do índice"}),sel]));
  var tg=h("div",{class:"tg",role:"group","aria-label":"Normalização das contagens"});
  [["exposicao","POR 1.000 m²"],["bruto","BRUTO"]].forEach(function(v){
    var b=h("button",{type:"button","data-v":v[0],text:v[1]}); b.addEventListener("click",function(){ estado.variante=v[0]; marcarToggle(); redesenhar(); }); tg.appendChild(b);
  });
  ctl.appendChild(h("div",{class:"lb"},[h("span",{class:"k",text:"Contagens"}),tg]));
  function marcarToggle(){ Array.prototype.forEach.call(tg.children,function(b){ b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===estado.variante)); }); }
  marcarToggle();
})();
(function(){
  var m=document.getElementById("meta");
  [["dado",D.meta.chamados_preenchidos.toLocaleString("pt-BR")+" chamados"],["até",D.meta.data_mais_recente],["sha256",D.meta.chamados_sha256.slice(0,12)],["gerado",D.meta.gerado_em_utc.slice(0,16).replace("T"," ")+" UTC"],["sorteios",String(D.meta.n_sorteios_smaa)]].forEach(function(p){ m.appendChild(h("dt",{text:p[0]})); m.appendChild(h("dd",{text:p[1]})); });
})();

/* ---------- 01 Estado ---------- */
function areaDe(c,a){
  var p=painelDe(c,a);
  if(!p||!p.area_m2){ /* sem área no ano: usa o ano mais próximo com valor */
    var cand=D.painel.filter(function(q){return q.campus===c && q.area_m2;}).sort(function(x,y){return Math.abs(x.ano-a)-Math.abs(y.ano-a);});
    p=cand[0];
  }
  return p.area_m2;
}
function calendarioMeses(){
  var fim=D.meta.data_mais_recente.slice(0,7), out=[], y=2018, m=1;
  while((y+"-"+(m<10?"0":"")+m)<=fim){ out.push(y+"-"+(m<10?"0":"")+m); m++; if(m>12){ m=1; y++; } }
  return out;
}
function mediaMovel(c){
  /* completa meses sem chamado com zero antes da média de 12 meses */
  var mapa={}; (D.mensal[c]||[]).forEach(function(m){ mapa[m[0]]=m[1]; });
  var cal=calendarioMeses(), v=cal.map(function(k){ return (mapa[k]||0)/(areaDe(c,+k.slice(0,4))/1000); }), out=[];
  for(var i=11;i<cal.length;i++){ var t=0; for(var j=0;j<12;j++) t+=v[i-j]; out.push([cal[i],t/12]); }
  return out;
}
function renderEstado(){
  var r=cab("estado","01","Estado da carteira","Chamados abertos hoje e pressão de demanda por área, por campus. Indicadores de 2025, exceto a carteira aberta, referida ao último registro da base.");
  var t=h("table"); t.appendChild(h("thead",{html:"<tr><th>Campus</th><th class='n'>Abertos</th><th style='width:26%'>Idade dos abertos</th><th class='n'>Chamados/ano por 1.000 m²</th><th class='n'>Com OS</th><th class='n'>IA baixa conf.</th></tr>"}));
  var tb=h("tbody");
  CAMPOS.forEach(function(c){
    var p=painelDe(c.id,2025), ab=D.carteira_aberta[c.id]||{}, tot=ab.total||1;
    var svg=s("svg",{viewBox:"0 0 200 14",width:"100%",role:"img","aria-label":"Idade dos chamados abertos de "+c.curto+": "+(ab.ate30||0)+" até 30 dias, "+(ab.d31a90||0)+" de 31 a 90, "+(ab.d91a365||0)+" de 91 a 365 e "+(ab.mais365||0)+" com mais de 365"});
    var x=0; [["ate30",.3],["d31a90",.5],["d91a365",.75],["mais365",1]].forEach(function(q){ var w=200*(ab[q[0]]||0)/tot; if(w<=0) return; svg.appendChild(s("rect",{x:x,y:0,width:Math.max(w-1,0.5),height:14,fill:q[0]==="mais365"?"var(--a)":COR[c.id],opacity:q[0]==="mais365"?1:q[1]})); x+=w; });
    var tr=h("tr"); tr.appendChild(h("td",{html:"<span class='sq' style='background:"+COR[c.id]+"'></span>"+c.curto}));
    tr.appendChild(h("td",{class:"n",text:f0(ab.total||0)}));
    var td=h("td"); td.appendChild(svg); td.appendChild(h("span",{class:"m",style:"font-size:.7rem;color:var(--soft)",text:(ab.mais365||0)+" com mais de 365 dias"})); tr.appendChild(td);
    tr.appendChild(h("td",{class:"n",text:nf(p.n_por_1000m2,1)})); tr.appendChild(h("td",{class:"n",text:nf(p.os_pct,1)+"%"})); tr.appendChild(h("td",{class:"n",text:nf(p.baixa_conf_pct,1)+"%"}));
    tb.appendChild(tr);
  });
  t.appendChild(tb); var f=fig(r,"Quadro 1"); f.appendChild(h("div",{class:"scroll"},[t]));
  f.appendChild(h("p",{class:"cap",html:"<b>Leitura.</b> Idade: tons claros são mais novos; em vermelhão, os abertos há mais de 365 dias. \"Com OS\" é a proporção de chamados com ordem de serviço (prática de registro, não demanda). \"IA baixa conf.\" é a fração classificada com a etiqueta de baixa confiança."}));

  var f2=fig(r,"Figura 1 · Demanda por área, média móvel de 12 meses");
  var W=820,H=300,L=44,R=130,T=14,B=26;
  var series=CAMPOS.map(function(c){ return {c:c,m:mediaMovel(c.id)}; });
  var max=0; series.forEach(function(q){ q.m.forEach(function(v){ if(v[1]>max) max=v[1]; }); }); max=Math.ceil(max/10)*10;
  var meses=series[0].m.map(function(v){return v[0];});
  var xs=function(i){ return L+(W-L-R)*i/(meses.length-1); }, ys=function(v){ return T+(H-T-B)*(1-v/max); };
  var svg=s("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Média móvel de 12 meses de chamados por mês por 1.000 metros quadrados, por campus"});
  if(!isFinite(max)||max<=0) max=10;
  for(var q4=0;q4<=4;q4++){ var g=max*q4/4; svg.appendChild(s("line",{x1:L,x2:W-R,y1:ys(g),y2:ys(g),stroke:"var(--hair)"})); svg.appendChild(s("text",{x:L-8,y:ys(g)+4,"text-anchor":"end","font-size":10.5,class:"n s",text:String(Math.round(g))})); }
  [2019,2020,2021,2022,2023,2024,2025,2026].forEach(function(a){ var i=meses.findIndex(function(m){return m>=a+"-01";}); if(i<0) return; svg.appendChild(s("line",{x1:xs(i),x2:xs(i),y1:H-B,y2:H-B+4,stroke:"var(--ink)"})); svg.appendChild(s("text",{x:xs(i),y:H-8,"text-anchor":"middle","font-size":10.5,class:"n s",text:String(a)})); });
  svg.appendChild(s("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,stroke:"var(--ink)"}));
  var ends=[];
  series.forEach(function(q){
    svg.appendChild(s("polyline",{points:q.m.map(function(v,i){return xs(i).toFixed(1)+","+ys(v[1]).toFixed(1);}).join(" "),fill:"none",stroke:COR[q.c.id],"stroke-width":1.8,"stroke-linejoin":"round"}));
    ends.push({id:q.c.id,y:ys(q.m[q.m.length-1][1]),t:q.c.curto});
  });
  ends.sort(function(a,b){return a.y-b.y;}); for(var i=1;i<ends.length;i++){ if(ends[i].y-ends[i-1].y<15) ends[i].y=ends[i-1].y+15; }
  ends.forEach(function(e){ svg.appendChild(s("text",{x:W-R+8,y:e.y+4,"font-size":12.5,style:"fill:"+COR[e.id],text:e.t})); });
  f2.appendChild(rolavel(svg,560));
  f2.appendChild(h("p",{class:"cap",html:"<b>Leitura.</b> Chamados abertos por mês divididos pela área do campus no ano (área de utilização do patrimônio; 2026 projetada em +5%), em média de 12 meses. Os quatro campi caem entre 2020 e 2021. Em Paulo Freire, parte da queda a partir de 2023 é aritmética: a área registrada passa de cerca de 5.200 para 14.200 m² nesse ano, o que reduz o denominador. Em 2026, a Reitoria apresenta a maior demanda por metro quadrado."}));
}

/* ---------- 02 Prioridade ---------- */
function alts(ano,v){ return D.prioridade[String(ano)][v].alternativas; }
function renderPrioridade(){
  var r=cab("prioridade","02","Prioridade com incerteza de pesos","24 alternativas (4 campi × 6 sistemas técnicos). Posto 1 é a maior prioridade de intervenção. Cada linha mostra onde a alternativa cai quando a importância dos quatro critérios varia ao acaso.");
  var f=fig(r,"Figura 2 · Intervalo de postos (5% a 95%), "+estado.ano+", contagens "+(estado.variante==="exposicao"?"por 1.000 m²":"brutas"));
  var A=alts(estado.ano,estado.variante).slice().sort(function(a,b){return a.posto_igual-b.posto_igual||a.posto_medio-b.posto_medio;});
  var outra=alts(estado.ano,estado.variante==="exposicao"?"bruto":"exposicao"), mo={}; outra.forEach(function(a){ mo[a.campus+"|"+a.familia]=a.posto_igual; });

  svg.appendChild(s("text",{x:x1+16,y:T-14,"font-size":10,class:"n s",text:"P(1º)"})); svg.appendChild(s("text",{x:x1+72,y:T-14,"font-size":10,class:"n s",text:"P(top 5)"})); svg.appendChild(s("text",{x:x1+142,y:T-14,"font-size":10,class:"n s",text:"OUTRA NORM."}));

  });
  f.appendChild(rolavel(svg,760));
  var lg=h("p",{class:"cap"}); CAMPOS.forEach(function(c){ lg.appendChild(h("span",{html:"<span class='sq' style='background:"+COR[c.id]+"'></span>"+c.curto+"&nbsp;&nbsp;&nbsp;"})); });

function bump(){

/* ---------- 03 Qualidade ---------- */
function mapa(rotulo,titulo,campo,esc,leg){

  var svg=s("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":titulo});
  anos.forEach(function(a,i){ svg.appendChild(s("text",{x:110+i*cw+cw/2,y:14,"text-anchor":"middle","font-size":10,class:"n s",text:a===2026?"2026*":String(a)})); });

    anos.forEach(function(a,i){
      var p=painelDe(c.id,a), v=p?p[campo]:null, t=v==null?0:Math.min(1,v/esc);

      if(v!=null) svg.appendChild(s("text",{x:110+i*cw+cw/2,y:24+rw*ch+ch/2+4,"text-anchor":"middle","font-size":11,class:"n",style:t>0.5?"fill:#fff":"",text:f0(v)}));

}

/* ---------- 04 Cenários ---------- */
function postos(A,w){ var tot=w.reduce(function(x,v){return x+v;},0)||1, sc=A.map(function(a){ return a.r.reduce(function(x,v,j){return x+v*w[j]/tot;},0); }); var ord=sc.map(function(v,i){return i;}).sort(function(a,b){return sc[b]-sc[a];}), rk=[]; ord.forEach(function(i,p){ rk[i]=p+1; }); return rk; }
